# GitHub Pages 自动部署：push 到 main → 构建 → 发布。
# 首次使用前需在仓库 Settings → Pages → Build and deployment → Source
# 选择「GitHub Actions」（详见 docs/05-部署步骤.md 第 3 步）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发（Actions 页面 → Run workflow）

# Pages 部署的官方推荐权限（最小集）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只保留一次部署（新 push 取消排队中的旧部署）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
